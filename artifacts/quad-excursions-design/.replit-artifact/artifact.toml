kind = "web"
previewPath = "/quad-excursions-design/"
title = "Quad Excursions · Nuovo sito"
description = "Implementazione autonoma del layout approvato: pagine e immagini originali, testata mobile corretta, ricerca e richieste informazioni via WhatsApp. Separata dal sito esistente."
version = "1.0.0"
id = "artifacts/quad-excursions-design"
router = "path"

[[services]]
name = "web"
paths = [ "/quad-excursions-design/" ]
localPort = 21328

[services.development]
run = "pnpm --filter @workspace/quad-excursions-design run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quad-excursions-design", "run", "build" ]
serve = "static"
publicDir = "artifacts/quad-excursions-design/dist/public"

[services.env]
PORT = "21328"
BASE_PATH = "/quad-excursions-design/"
